services:
  dsa-practice-solver-paddleocr:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - dsa-data:/app/data
      - dsa-paddleocr-cache:/root/.paddlex
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # PaddleOCR's first-ever startup downloads model weights before
      # the warm-up completes; give it more room than a plain FastAPI
      # boot would need before the healthcheck starts failing it.
      start_period: 60s

volumes:
  dsa-data:
  dsa-paddleocr-cache:
